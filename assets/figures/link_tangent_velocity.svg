<svg font-family="Arial,Helvetica,sans-serif" xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="t d"><title id="t">Rotating link and tangential velocity components</title><desc id="d">A rigid link 150 mm long at 45 degrees from X rotates counterclockwise at 0.1 radians per second. Tip velocity tangent is 15 mm per second upper-left, with vx minus 10.61 and vy plus 10.61 millimetres per second.</desc><rect width="1000" height="700" fill="#f8fafc"/><line x1="100" y1="610" x2="925" y2="610" stroke="#64748b" stroke-width="2"/><line x1="180" y1="650" x2="180" y2="75" stroke="#64748b" stroke-width="2"/><text x="929" y="628" fill="#334155" font-size="23">+X</text><text x="190" y="70" fill="#334155" font-size="23">+Y</text><path d="M 600 610 A 420 420 0 0 0 180 190" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7" fill="none"/><line x1="180" y1="610" x2="477" y2="313" stroke="#2563eb" stroke-width="7"/><path d="M 260 610 A 80 80 0 0 0 236.57 553.43" fill="none" stroke="#d97706" stroke-width="3"/><text x="270" y="568" font-size="22" fill="#b45309">Q = 45°</text><circle cx="180" cy="610" r="7" fill="#0f172a"/><circle cx="477" cy="313" r="8" fill="#1d4ed8"/><text x="300" y="460" font-size="22" fill="#1d4ed8">L = 150 mm</text><line x1="477" y1="313" x2="317" y2="153" stroke="#059669" stroke-width="6"/><polygon points="309,145 316,165 329,152" fill="#059669"/><text x="306" y="115" font-size="23" fill="#047857">speed = 15 mm/s</text><line x1="477" y1="313" x2="305" y2="313" stroke="#dc2626" stroke-width="4"/><polygon points="297,313 314,306 314,320" fill="#dc2626"/><text x="300" y="351" font-size="21" fill="#b91c1c">v_x = −10.61 mm/s</text><line x1="477" y1="313" x2="477" y2="140" stroke="#7c3aed" stroke-width="4"/><polygon points="477,132 470,150 484,150" fill="#7c3aed"/><text x="490" y="197" font-size="21" fill="#6d28d9">v_y = +10.61 mm/s</text><text x="193" y="631" fill="#0f172a" font-size="21">O</text><text x="560" y="520" font-size="22" fill="#334155">ω = +0.1 rad/s (CCW)</text><text x="500" y="675" text-anchor="middle" fill="#475569" font-size="19">Tip velocity is perpendicular to the link. Positive CCW rotation.</text></svg>
