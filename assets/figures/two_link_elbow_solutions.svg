<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">Two elbow configurations reach the same target</title><desc id="desc">Two 100 mm links from origin reach tip (100 mm,100 mm) either via elbow (100,0) with relative angles (0,90) or elbow (0,100) with (90,-90).</desc>
<rect width="760" height="490" fill="#f8fafc" rx="20"/>
<style>text{font-family:Arial,sans-serif;fill:#1e293b}.h{font-size:25px;font-weight:700}.sm{font-size:16px}.tiny{font-size:14px}.lg{font-size:19px;font-weight:600}.axis{stroke:#475569;stroke-width:2}.guide{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 6}</style>

<text x="32" y="43" class="h">Two solutions for one target</text>
<text x="32" y="73" class="sm">Both links = 100 mm; tip B = (100,100) mm</text>
<path d="M 100 387 H 660 M 100 418 V 88" class="axis" fill="none"/>
<path d="M 660 387 l -12 -7 v 14 Z M 100 88 l -7 12 h 14 Z" fill="#475569"/>
<text x="668" y="391" class="sm">X</text><text x="89" y="84" class="sm">Y</text>
<path d="M 100 387 H 350 V 137" stroke="#0d9488" stroke-width="7" stroke-linecap="round" fill="none"/>
<path d="M 100 387 V 137 H 350" stroke="#d97706" stroke-width="7" stroke-linecap="round" fill="none"/>
<circle cx="100" cy="387" r="7" fill="#475569"/>
<circle cx="350" cy="387" r="7" fill="#0d9488"/>
<circle cx="100" cy="137" r="7" fill="#d97706"/>
<circle cx="350" cy="137" r="9" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
<text x="359" y="126" class="lg">B (100,100)</text>
<text x="355" y="405" class="sm">A1 (100,0)</text>
<text x="113" y="130" class="sm">A2 (0,100)</text>
<rect x="420" y="230" width="296" height="107" rx="10" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="435" y="260" class="sm">Teal: θ1=0°, θ2=+90°</text>
<text x="435" y="290" class="sm">Orange: θ1=+90°, θ2=−90°</text>
<text x="435" y="321" class="tiny">θ2 is relative to link 1.</text>
<text x="34" y="470" class="tiny">Same endpoint, different joint positions: typical elbow branches.</text>

</svg>