<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1295" viewBox="0 0 1500 1295" role="img" aria-labelledby="title desc">
<title id="title">Unit circle — 16 independent sine and cosine reference labels</title>
<desc id="desc">One unit circle with a distinct two-line sine/cosine label connected to each of the 16 common angles. Each function has an exact signed fractional value and a four-decimal approximation.</desc>
<style>
  .heading{font:700 28px Arial,Helvetica,sans-serif;fill:#0f172a}
  .hint{font:17px Arial,Helvetica,sans-serif;fill:#475569}
  .axis{stroke:#94a3b8;stroke-width:1.8}
  .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
  .angle{font:700 22px Arial,Helvetica,sans-serif;fill:#0f172a}
  .cos{font:18px Arial,Helvetica,sans-serif;fill:#0f766e}
  .sin{font:18px Arial,Helvetica,sans-serif;fill:#1d4ed8}
  .leader{fill:none;stroke:#64748b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .tick{fill:#0f172a}
</style>
