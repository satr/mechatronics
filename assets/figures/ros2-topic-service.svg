<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
<title id="title">ROS 2 topic and service architecture</title>
<desc id="desc">Publisher node sends typed String messages on a topic to the monitor node. CLI receives service response from the monitor's Trigger service. Three separate processes run inside a Docker container.</desc>
<rect width="920" height="460" fill="#fff"/>
<rect x="26" y="34" width="868" height="388" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="48" y="72" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">Docker container · ROS_DOMAIN_ID=42</text>
<rect x="60" y="122" width="235" height="104" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
<text x="82" y="159" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#1d4ed8">/sample_source</text>
<text x="82" y="188" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#334155">Publisher · Process A</text>
<text x="82" y="208" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#334155">1 sample / second</text>
<rect x="625" y="122" width="235" height="104" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="645" y="159" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#166534">/sample_monitor</text>
<text x="645" y="188" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#334155">Subscriber · Process B</text>
<text x="645" y="208" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#334155">Counts received samples</text>
<path d="M295 174 H620" fill="none" stroke="#2563eb" stroke-width="3"/>
<path d="M620 174 l-12 -8 v16 z" fill="#2563eb"/>
<rect x="334" y="116" width="249" height="46" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
<text x="348" y="135" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1e40af">/training/status · topic</text>
<text x="348" y="153" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e40af">std_msgs/msg/String</text>
<rect x="60" y="290" width="235" height="100" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="82" y="327" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#92400e">ros2 CLI</text>
<text x="82" y="354" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#334155">Client · Process C</text>
