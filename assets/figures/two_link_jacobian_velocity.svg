<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Planar two-joint arm and Jacobian velocity contributions</title>
<desc id="desc">At Q1 30 degrees and relative Q2 60 degrees, two velocity contributions at the tool add to a resultant of minus 20 and plus 8.66 millimetres per second.</desc>
<rect x="1" y="1" width="758" height="348" rx="10" stroke="#cbd5e1" stroke-width="2" fill="white"/>
<line x1="130" y1="292" x2="382" y2="292" stroke="#64748b" stroke-width="2"/><polygon points="382,292 370,286 370,298" fill="#64748b"/>
<line x1="130" y1="292" x2="130" y2="35" stroke="#64748b" stroke-width="2"/><polygon points="130,35 124,47 136,47" fill="#64748b"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#334155" font-size="17">
<text x="395" y="298">+X</text><text x="107" y="29">+Y</text>
<text x="184" y="265">Q₁=30°</text><text x="297" y="167">Q₂=60°</text>
<text x="190" y="211">L₁=100 mm</text><text x="301" y="202">L₂=50 mm</text>
<text x="107" y="322">O</text><text x="300" y="244">E</text><text x="300" y="115">T</text>
</g>
<line x1="130" y1="292" x2="278" y2="207" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
<line x1="278" y1="207" x2="278" y2="122" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
<circle cx="130" cy="292" r="9" stroke="#111827" stroke-width="3" fill="white"/>
<circle cx="278" cy="207" r="9" stroke="#111827" stroke-width="3" fill="white"/>
<circle cx="278" cy="122" r="8" fill="#111827"/>
<line x1="278" y1="122" x2="218" y2="70" stroke="#2563eb" stroke-width="4"/><polygon points="218,70 230,73 223,85" fill="#2563eb"/>
<line x1="278" y1="122" x2="218" y2="122" stroke="#ea580c" stroke-width="4"/><polygon points="218,122 230,115 230,129" fill="#ea580c"/>
<line x1="218" y1="70" x2="158" y2="70" stroke="#ea580c" stroke-dasharray="7 6" stroke-width="2"/>
<line x1="218" y1="122" x2="158" y2="70" stroke="#2563eb" stroke-dasharray="7 6" stroke-width="2"/>
<line x1="278" y1="122" x2="158" y2="70" stroke="#059669" stroke-width="5"/><polygon points="158,70 172,69 166,82" fill="#059669"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="19">
<text x="435" y="55" fill="#111827">ω₁=+0.1 rad/s</text>
<text x="435" y="88" fill="#111827">ω₂=+0.2 rad/s</text>
<line x1="435" y1="130" x2="470" y2="130" stroke="#2563eb" stroke-width="5"/>
<text x="484" y="136" fill="#1d4ed8">J₁ω₁=(−10, +8.66)</text>
<line x1="435" y1="177" x2="470" y2="177" stroke="#ea580c" stroke-width="5"/>
<text x="484" y="183" fill="#c2410c">J₂ω₂=(−10, 0)</text>
<line x1="435" y1="224" x2="470" y2="224" stroke="#059669" stroke-width="5"/>
<text x="484" y="230" fill="#047857">v=(−20, +8.66)</text>
<text x="435" y="274" fill="#334155">mm/s</text>
</g>
</svg>
