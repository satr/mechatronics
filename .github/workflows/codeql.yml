name: SAST Security Analysis (CodeQL)

on:
  push:
  pull_request:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          queries: security-extended

      - name: Analyze and retain SARIF
        id: analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          output: codeql-sarif
          # Upload findings only when code scanning is available and the event is trusted.
          upload: ${{ (!github.event.repository.private && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)) && 'always' || 'never' }}

      - name: Save SARIF for review (including while private)
        if: always() && steps.analysis.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-sarif/*.sarif
          if-no-files-found: error
          retention-days: 14
