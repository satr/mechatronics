name: Secret Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "45 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          version: 3.99.9
          head: HEAD
          # Verified credentials and cases where verification could not complete
          # block CI. Unverified heuristic candidates are reviewed separately,
          # not treated as confirmed secrets solely from SHA-like patterns.
          extra_args: --results=verified,unknown
