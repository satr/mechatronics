name: Diagnose unverified secret candidates (metadata only)

# One-time run on introduction, then manual reruns on trusted main.
# Never executes PR-supplied code or receives repository secrets.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-candidate-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted history (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Locate candidates without disclosing candidate values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report="$(mktemp)"
          errors="$(mktemp)"
          trap 'rm -f "$report" "$errors"' EXIT

          # Write full JSON ONLY to a private runner temp file. The CLI stderr
          # is also withheld from the public workflow log in case it includes a candidate.
          if ! docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.99.9 \
            git file:///repo --branch HEAD --no-update \
            --results=unverified --json >"$report" 2>"$errors"; then
            echo "The diagnostic scanner failed; no candidate data was printed." >&2
            exit 1
          fi

          python3 - "$report" <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          count = 0
          unclassified = 0
          with open(sys.argv[1], encoding="utf-8") as stream:
              for record in stream:
                  if not record.lstrip().startswith("{"):
                      continue
                  obj = json.loads(record)
                  count += 1
                  git = obj.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
                  path = git.get("file", "")
                  line_no = git.get("line")
                  commit = git.get("commit", "")
                  raw = obj.get("Raw", "")
                  is_pin = False
                  # Use the historical file at this commit, not the current file:
                  # never print the source line or the raw detected value.
                  if (isinstance(path, str) and isinstance(commit, str)
                          and re.fullmatch(r"[0-9a-f]{40}", commit)
                          and isinstance(line_no, int) and line_no > 0
                          and ".." not in pathlib.PurePosixPath(path).parts):
                      p = subprocess.run(
                          ["git", "show", f"{commit}:{path}"],
                          capture_output=True, text=True, check=False, timeout=8,
                      )
                      if p.returncode == 0:
                          lines = p.stdout.splitlines()
                          if line_no <= len(lines):
                              source = lines[line_no - 1]
                              action = re.search(
                                  r"uses:\s+[\w.-]+(?:/[\w.-]+)+@([a-f0-9]{40})",
                                  source,
                              )
                              is_pin = bool(action and action.group(1) == raw)
                  # Metadata only. No Raw, Redacted, ExtraData, or source contents.
                  safe_path = re.sub(r"[^A-Za-z0-9_./-]", "_", str(path))[:180]
                  safe_detector = re.sub(r"[^A-Za-z0-9_-]", "_",
                                         str(obj.get("DetectorName", "unknown")))[:40]
                  print(f"#{count}: detector={safe_detector} "
                        f"file={safe_path or 'unknown'} line={line_no or '?'} "
                        f"commit={commit[:10]} pinned_action_sha={is_pin}")
                  if not is_pin:
                      unclassified += 1
          print(f"Total unverified candidates: {count}; "
                f"not matched to a pinned Actions SHA: {unclassified}")
          if unclassified:
              print("Review those locations in the private repository before publishing.")
          PY
